@let item = country();
<ion-card>
  <div class="flag">
    @if (item.flags.svg || item.flags.png; as flagUrl) {
      <img [src]="flagUrl" [alt]="item.flags.alt ?? ''" loading="lazy" decoding="async" />
    } @else {
      <span>Bandera no disponible</span>
    }
  </div>
  <ion-card-content>
    <h3>{{ item.name.common }}</h3>
    <dl>
      <div>
        <dt>Capital</dt>
        <dd>{{ item.capital?.join(', ') || 'Sin datos' }}</dd>
      </div>
      <div>
        <dt>Región</dt>
        <dd>{{ item.region || 'Sin datos' }}</dd>
      </div>
    </dl>
    <div class="actions">
      <ion-button
        fill="clear"
        size="small"
        (click)="details.emit(item)"
        [attr.aria-label]="'Ver detalles de ' + item.name.common"
      >
        Ver detalles
      </ion-button>
      <ion-button
        fill="clear"
        size="small"
        (click)="favoriteToggle.emit(item.cca3)"
        [attr.aria-label]="(favorite() ? 'Quitar de favoritos ' : 'Agregar a favoritos ') + item.name.common"
      >
        <ion-icon slot="icon-only" [name]="favorite() ? 'heart' : 'heart-outline'" aria-hidden="true"></ion-icon>
      </ion-button>
    </div>
  </ion-card-content>
</ion-card>
